<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫療數據智慧製圖工具 (Standalone v21.4.3)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <style>
        body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; }
        
        .chart-wrapper { 
            position: relative; 
            margin-bottom: 2rem; 
            border: 1px solid #e5e7eb; 
            border-radius: 0.5rem; 
            padding: 1rem; 
            background: white; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 甘特圖滾動容器：固定行距且防止縱軸拉長 */
        .gantt-scroll-container {
            width: 100%;
            overflow-y: auto;
            max-height: 600px; 
            border: 1px solid #f3f4f6;
            border-radius: 4px;
            background: white;
        }

        .chart-toolbar { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center;
            margin-bottom: 0.5rem; 
            border-bottom: 1px solid #f3f4f6; 
            padding-bottom: 0.5rem; 
        }
        .chart-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #374151;
            margin-right: auto;
        }
        .chart-btn { 
            font-size: 0.85rem; 
            padding: 0.4rem 0.8rem; 
            background: #3b82f6; 
            color: white; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background 0.2s;
            font-weight: 500;
        }
        .chart-btn:hover { background: #2563eb; }

        textarea.nowrap { 
            white-space: pre; 
            overflow-x: auto; 
            font-family: monospace; 
            font-size: 0.9rem; 
            line-height: 1.5;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-[1600px] mx-auto w-full">
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">醫療數據智慧製圖工具</h1>
                <p class="text-gray-500 mt-1">支援原始表格解析・自動分群趨勢圖・動態用藥甘特圖</p>
            </div>
            <div class="mt-4 md:mt-0">
                <button onclick="clearAll()" class="text-sm text-red-500 hover:text-red-700 font-medium underline">清空所有內容</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            
            <div class="space-y-6">
                
                <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-blue-500">
                    <label class="block text-lg font-bold text-gray-700 mb-2 flex justify-between">
                        1. 檢驗數據 (Lab Data)
                        <span class="text-xs font-normal text-gray-400 self-end">支援表格與文字</span>
                    </label>
                    <div class="text-xs text-gray-500 mb-2 p-2 bg-gray-50 rounded">
                        <strong>支援格式：</strong><br>
                        1. 原始表格：含 <code>│</code> 或 <code>|</code> 的直式/橫式表格<br>
                        2. 文字模式：<code>ALT: 40(10/1), 55(10/2)</code>
                    </div>
                    <textarea id="labDataInput" rows="12" class="nowrap w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow outline-none" 
                    placeholder="在此貼上 Lab 數據...
範例：
│項目    │1130│1201│
│ALT     │    │11  │
│WBC     │5.6 │9.8 │"></textarea>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-green-500">
                    <label class="block text-lg font-bold text-gray-700 mb-2 flex justify-between">
                        2. 用藥紀錄 (Medication)
                        <span class="text-xs font-normal text-gray-400 self-end">支援清單與區間</span>
                    </label>
                    <div class="text-xs text-gray-500 mb-2 p-2 bg-gray-50 rounded">
                        <strong>支援格式：</strong><br>
                        1. 原始清單：<code>Vanco 1g Q12H ... 12/01 12/05</code><br>
                        2. 簡易模式：<code>Teiyu (11/28-12/05)</code>
                    </div>
                    <textarea id="medDataInput" rows="12" class="nowrap w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-shadow outline-none" 
                    placeholder="在此貼上用藥清單...
範例：
Saline 0.9% ... 12/01 12/05
Tazocin 4.5g Q8H ... 12/02"></textarea>
                </div>
            </div>

            <div class="space-y-6">
                <div id="chartsOutput" class="space-y-6">
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400 border-2 border-dashed border-gray-300 rounded-xl p-10 min-h-[400px]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
                        </svg>
                        <p class="text-lg">圖表預覽區域</p>
                        <p class="text-sm mt-2">請在左側貼上資料，圖表將自動產生。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CHART_COLORS = { orange: 'rgb(249, 115, 22)', blue: 'rgb(59, 130, 246)', purple: 'rgb(168, 85, 247)', red: 'rgb(239, 68, 68)', teal: 'rgb(20, 184, 166)', gray: 'rgb(107, 114, 128)' };

        const LAB_GROUPS = [
            { name: '肝功能 (Liver)', keys: ['AST', 'GOT', 'ALT', 'GPT'], colors: [CHART_COLORS.orange, CHART_COLORS.red], type: 'normal' },
            { name: '發炎指標 (Infection)', keys: ['WBC', 'CRP', 'PCT', 'NEUTROPHIL', 'SEG'], colors: [CHART_COLORS.blue, CHART_COLORS.purple, CHART_COLORS.teal], type: 'dual', leftKeys: ['WBC'], rightKeys: ['CRP', 'PCT'] },
            { name: '腎功能 (Renal)', keys: ['SCR', 'CREA', 'BUN'], colors: [CHART_COLORS.red, CHART_COLORS.blue], type: 'dual', leftKeys: ['BUN'], rightKeys: ['SCR', 'CREA'] },
            { name: '電解質 (Electrolytes)', keys: ['NA', 'K', 'CL', 'CA', 'MG', 'P'], colors: [CHART_COLORS.teal, CHART_COLORS.orange, CHART_COLORS.purple], type: 'normal' },
            { name: '血糖 (Glucose)', keys: ['GLU', 'GLUCOSE', 'AC', 'PC'], colors: [CHART_COLORS.orange], type: 'normal' }
        ];

        let activeCharts = [];

        function parseChartDate(str) {
            if (!str) return null;
            const match = str.match(/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}))?/);
            if (!match) {
                if (/^\d{4}$/.test(str)) {
                    const m = parseInt(str.substring(0, 2)) - 1;
                    const d = parseInt(str.substring(2, 4));
                    return new Date(new Date().getFullYear(), m, d);
                }
                return null;
            }
            const y = new Date().getFullYear();
            const m = parseInt(match[1]) - 1;
            const d = parseInt(match[2]);
            const hour = match[3] ? parseInt(match[3]) : 0;
            const min = match[4] ? parseInt(match[4]) : 0;
            return new Date(y, m, d, hour, min);
        }

        function parseLab(text) {
            const lab = {};
            const lines = text.split('\n').filter(l => l.trim());
            const isTable = lines.some(l => l.includes('│') || l.includes('|'));
            if (isTable) {
                let headers = [], indices = [];
                const headerIdx = lines.findIndex(l => /\d{3,4}/.test(l) && (l.includes('│')||l.includes('|')));
                if (headerIdx > -1) {
                    lines[headerIdx].split(/[│|]/).forEach((s, i) => {
                        if (/\d{3,4}/.test(s.trim())) { headers.push(parseChartDate(s.trim())); indices.push(i); }
                    });
                    for (let i = headerIdx + 1; i < lines.length; i++) {
                        const parts = lines[i].split(/[│|]/);
                        const name = (parts[0]||parts[1]||"").trim();
                        if (!name || name.includes('項目') || name.includes('單位')) continue;
                        const key = name.toUpperCase().replace(/[^A-Z0-9]/g, '');
                        if (!lab[key]) lab[key] = { label: name, data: [] };
                        indices.forEach((colIdx, k) => {
                            const valStr = (parts[colIdx]||"").trim();
                            if(valStr) {
                                const val = parseFloat(valStr);
                                if (!isNaN(val)) lab[key].data.push({ x: headers[k], y: val });
                            }
                        });
                    }
                }
            } else {
                const regex = /(\d+(?:\.\d+)?)\s*.*?\s*\(?([\d\.\/-]+(?:\s+\d+:\d+)?)\)?/g;
                lines.forEach(l => {
                    if (!l.includes(':') && !l.includes('：')) return;
                    const parts = l.split(/[:：]/);
                    const name = parts[0].trim();
                    const key = name.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    if (!lab[key]) lab[key] = { label: name, data: [] };
                    let m; while ((m = regex.exec(parts[1])) !== null) {
                        const d = parseChartDate(m[2]);
                        if(d) lab[key].data.push({ x: d, y: parseFloat(m[1]) });
                    }
                });
            }
            return lab;
        }

        function parseMed(text) {
            const meds = { labels: [], data: [], colors: [] };
            const lines = text.split('\n').filter(l => l.trim());
            const colors = Object.values(CHART_COLORS);
            const dateRegex = /(\d{1,2}\/\d{1,2}(?:\s+\d{1,2}:\d{2})?)/g;
            
            let globalMaxDate = new Date(0);
            lines.forEach(l => {
                const found = l.match(dateRegex);
                if (found) found.forEach(dStr => {
                    const d = parseChartDate(dStr);
                    if (d && d > globalMaxDate) globalMaxDate = d;
                });
            });
            if (globalMaxDate.getTime() === 0) globalMaxDate = new Date();

            let cIdx = 0;
            lines.forEach(l => {
                const datesFound = l.match(dateRegex);
                if (datesFound) {
                    let start = parseChartDate(datesFound[0]);
                    let end = datesFound.length > 1 ? parseChartDate(datesFound[1]) : new Date(globalMaxDate);
                    const firstDateIdx = l.search(dateRegex);
                    let label = l.substring(0, firstDateIdx).trim().split(/\s{2,}/)[0];

                    if (start && end) {
                        meds.labels.push(label);
                        meds.data.push([start.getTime(), end.getTime()]);
                        meds.colors.push(colors[cIdx++ % colors.length]);
                    }
                }
            });
            return meds;
        }

        function renderAll() {
            document.getElementById('chartsOutput').innerHTML = '';
            activeCharts.forEach(c => c.destroy());
            activeCharts = [];
            const labText = document.getElementById('labDataInput').value;
            const medText = document.getElementById('medDataInput').value;
            if (!labText && !medText) {
                document.getElementById('chartsOutput').innerHTML = `<div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400 border-2 border-dashed border-gray-300 rounded-xl p-10 min-h-[400px]"><p class="text-lg">圖表預覽區域</p></div>`;
                return;
            }
            if (labText) {
                const labData = parseLab(labText);
                const processed = new Set();
                LAB_GROUPS.forEach(g => {
                    const keys = Object.keys(labData).filter(k => g.keys.some(gk => k.includes(gk)) && labData[k].data.length > 0);
                    if (keys.length > 0) createLabChart(g.name, keys, labData, g, processed);
                });
                Object.keys(labData).forEach(key => {
                    if (!processed.has(key) && labData[key].data.length > 1) createLabChart(labData[key].label, [key], labData, { colors: [CHART_COLORS.gray], type: 'normal' }, processed);
                });
            }
            if (medText) {
                const medData = parseMed(medText);
                if (medData.data.length > 0) createGanttChart(medData);
            }
        }

        function createLabChart(title, keys, labData, groupConfig, processedSet) {
            const wrapper = document.createElement('div');
            wrapper.className = 'chart-wrapper';
            const canvasId = `chart_${Math.random().toString(36).substr(2, 9)}`;
            wrapper.innerHTML = `<div class="chart-toolbar"><h3 class="chart-title">${title}</h3><button class="chart-btn" onclick="downloadChart('${canvasId}', '${title}.png')">📥 下載</button></div><canvas id="${canvasId}" style="max-height:300px;"></canvas>`;
            document.getElementById('chartsOutput').appendChild(wrapper);
            const datasets = keys.map((k, i) => {
                processedSet.add(k);
                const d = labData[k]; d.data.sort((a,b) => a.x - b.x);
                return { label: d.label, data: d.data, borderColor: groupConfig.colors[i % groupConfig.colors.length], backgroundColor: groupConfig.colors[i % groupConfig.colors.length], yAxisID: (groupConfig.type === 'dual' && groupConfig.rightKeys?.some(rk => k.includes(rk))) ? 'y1' : 'y', tension: 0.3, pointRadius: 4 };
            });
            activeCharts.push(new Chart(document.getElementById(canvasId).getContext('2d'), { type: 'line', data: { datasets }, options: { scales: { x: { type: 'time', time: { unit: 'day' } }, y: { position: 'left' }, ...(groupConfig.type === 'dual' ? { y1: { position: 'right', grid: { drawOnChartArea: false } } } : {}) } } }));
        }

        function createGanttChart(medData) {
            const wrapper = document.createElement('div');
            wrapper.className = 'chart-wrapper';
            const canvasId = `chart_gantt_${Math.random().toString(36).substr(2, 9)}`;
            const rowHeight = 40;
            const chartHeight = (medData.labels.length * rowHeight) + 60;
            wrapper.innerHTML = `<div class="chart-toolbar"><h3 class="chart-title">用藥甘特圖</h3><button class="chart-btn" onclick="downloadChart('${canvasId}', 'gantt.png')">📥 下載</button></div><div class="gantt-scroll-container"><canvas id="${canvasId}" style="height: ${chartHeight}px; width: 100%;"></canvas></div>`;
            document.getElementById('chartsOutput').appendChild(wrapper);
            const allDates = medData.data.flat();
            activeCharts.push(new Chart(document.getElementById(canvasId).getContext('2d'), {
                type: 'bar',
                data: {
                    labels: medData.labels,
                    datasets: [{ data: medData.labels.map((l, i) => ({ x: [medData.data[i][0], medData.data[i][1]], y: l })), backgroundColor: medData.colors, maxBarThickness: 25, barPercentage: 0.8, borderRadius: 4 }]
                },
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { type: 'time', min: Math.min(...allDates)-86400000, max: Math.max(...allDates)+86400000, time: { unit: 'day', displayFormats: { day: 'MM/dd' } } }, y: { ticks: { autoSkip: false, font: { weight: 'bold' } } } } }
            }));
        }

        window.downloadChart = (id, name) => { const c = document.getElementById(id); const a = document.createElement('a'); a.download = name; a.href = c.toDataURL(); a.click(); };
        window.clearAll = () => { if(confirm("清空內容？")) { document.getElementById('labDataInput').value = ""; document.getElementById('medDataInput').value = ""; renderAll(); } };
        let timer;
        const debounced = () => { clearTimeout(timer); timer = setTimeout(renderAll, 600); };
        document.getElementById('labDataInput').addEventListener('input', debounced);
        document.getElementById('medDataInput').addEventListener('input', debounced);
    </script>
</body>
</html>

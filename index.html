<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫療數據智慧製圖工具 (v22.7.6)</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; }
        .chart-wrapper { position: relative; margin-bottom: 2rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .gantt-scroll-container { width: 100%; overflow-y: auto; max-height: 600px; border: 1px solid #f3f4f6; border-radius: 4px; background: white; }
        .chart-toolbar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 0.5rem; border-bottom: 1px solid #f3f4f6; padding-bottom: 0.5rem; }
        .chart-title { font-size: 1.1rem; font-weight: 700; color: #374151; margin-right: auto; }
        .chart-btn { font-size: 0.85rem; padding: 0.4rem 0.8rem; background: #3b82f6; color: white; border-radius: 4px; cursor: pointer; transition: background 0.2s; font-weight: 500; }
        .chart-btn:hover { background: #2563eb; }
        textarea.nowrap { white-space: pre; overflow-x: auto; font-family: monospace; font-size: 0.9rem; line-height: 1.5; }
        
        /* 調整 Markdown 區塊內代碼塊的滾動條 */
        .prose pre { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-[1600px] mx-auto w-full">
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">醫療數據智慧製圖工具</h1>
                <p class="text-gray-500 mt-1">v22.7.6</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-4 items-center">
                <button onclick="toggleReadme()" class="text-sm text-blue-600 hover:text-blue-800 font-medium underline flex items-center">
                    📖 說明與教學 (README)
                </button>
                <button onclick="clearAll()" class="text-sm text-red-500 hover:text-red-700 font-medium underline">清空所有內容</button>
            </div>
        </header>

        <div id="readmeContainer" class="hidden mb-8 bg-white p-6 md:p-10 rounded-xl shadow-md border-t-4 border-blue-500 transition-all duration-300">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">使用說明</h2>
                <button onclick="toggleReadme()" class="text-gray-500 hover:text-gray-800 font-bold text-xl">&times;</button>
            </div>
            <div id="readmeContent" class="prose max-w-none">
                <div class="flex items-center justify-center py-10 text-gray-500">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    正在從 GitHub 載入 README...
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            <div class="space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-blue-500">
                    <label class="block text-lg font-bold text-gray-700 mb-2">1. 檢驗數據 (Lab Data)</label>
                    <textarea id="labDataInput" rows="12" class="nowrap w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="在此貼上 Lab 數據..."></textarea>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-green-500">
                    <label class="block text-lg font-bold text-gray-700 mb-2">2. 用藥紀錄 (Medication)</label>
                    <textarea id="medDataInput" rows="12" class="nowrap w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="在此貼上處方表格..."></textarea>
                </div>
            </div>

            <div class="space-y-6">
                <div id="chartsOutput" class="space-y-6">
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400 border-2 border-dashed border-gray-300 rounded-xl p-10 min-h-[400px]">
                        <p class="text-lg">圖表預覽區域</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 5. GitHub README 抓取邏輯 ---
        let readmeLoaded = false;
        async function toggleReadme() {
            const container = document.getElementById('readmeContainer');
            container.classList.toggle('hidden');
            
            // 只有在第一次打開且尚未載入時才 Fetch
            if (!container.classList.contains('hidden') && !readmeLoaded) {
                try {
                    // 使用 Raw URL 獲取純文本 Markdown
                    const response = await fetch('https://raw.githubusercontent.com/Almightyhao/MediSpan/main/README.md');
                    if (!response.ok) throw new Error('Network response was not ok');
                    const mdText = await response.text();
                    
                    // 轉譯 Markdown 為 HTML 並放進去
                    document.getElementById('readmeContent').innerHTML = marked.parse(mdText);
                    readmeLoaded = true;
                } catch (error) {
                    console.error("無法載入 README:", error);
                    document.getElementById('readmeContent').innerHTML = `
                        <div class="text-red-500 p-4 border border-red-200 rounded bg-red-50">
                            載入 README 失敗。請確認您的網路連線，或直接前往 GitHub 檢視：<br>
                            <a href="https://github.com/Almightyhao/MediSpan/blob/main/README.md" target="_blank" class="underline text-blue-600">點此前往 GitHub</a>
                        </div>`;
                }
            }
        }

        const CHART_COLORS = { orange: 'rgb(249, 115, 22)', blue: 'rgb(59, 130, 246)', purple: 'rgb(168, 85, 247)', red: 'rgb(239, 68, 68)', teal: 'rgb(20, 184, 166)', gray: 'rgb(107, 114, 128)' };

        const LAB_GROUPS = [
            { name: '肝功能 (Liver)', keys: ['AST', 'GOT', 'ALT', 'GPT', 'ALBUMIN', 'BILIRUBINTOTAL', 'BILIRUBIN', 'TBIL'], colors: [CHART_COLORS.orange, CHART_COLORS.red, CHART_COLORS.teal, CHART_COLORS.purple], type: 'dual', leftKeys: ['AST', 'GOT', 'ALT', 'GPT'], rightKeys: ['ALBUMIN', 'BILIRUBINTOTAL', 'BILIRUBIN', 'TBIL'] },
            { name: '腎功能 (Renal)', keys: ['CREATININE', 'CREA', 'SCR', 'BUN'], colors: [CHART_COLORS.red, CHART_COLORS.blue], type: 'dual', leftKeys: ['BUN'], rightKeys: ['CREATININE', 'CREA', 'SCR'] },
            { name: '發炎指標 (Infection)', keys: ['WBC', 'CRP', 'NEUTROPHIL', 'SEG', 'PCT'], colors: [CHART_COLORS.blue, CHART_COLORS.purple, CHART_COLORS.teal], type: 'dual', leftKeys: ['WBC', 'NEUTROPHIL', 'SEG'], rightKeys: ['CRP', 'PCT'] },
            { name: '電解質 (Electrolytes)', keys: ['NA', 'SODIUM', 'K', 'POTASSIUM', 'CL', 'CHLORIDE', 'CA', 'CALCIUM'], colors: [CHART_COLORS.teal, CHART_COLORS.orange, CHART_COLORS.purple, CHART_COLORS.gray], type: 'normal' },
            { name: '血糖 (Glucose)', keys: ['GLU', 'GLUCOSE', 'AC', 'PC'], colors: [CHART_COLORS.orange], type: 'normal' },
            { name: '血液 (Blood)', keys: ['EOSINOPHIL', 'LYMPHOCYTE', 'MCH', 'PLT', 'HCT', 'HB', 'HEMOGLOBIN', 'MCHC', 'MCV', 'RBC'], colors: [CHART_COLORS.red, CHART_COLORS.blue, CHART_COLORS.gray, CHART_COLORS.teal, CHART_COLORS.orange, CHART_COLORS.purple, CHART_COLORS.red, CHART_COLORS.blue, CHART_COLORS.gray], type: 'normal' },
            { name: '心臟指標 (Cardiac)', keys: ['PROBNP', 'TROPONIN', 'TROPONINI'], colors: [CHART_COLORS.red, CHART_COLORS.blue], type: 'normal' },
            { name: '凝血指標 (Coagulation)', keys: ['APTT', 'INR', 'PT'], colors: [CHART_COLORS.purple, CHART_COLORS.teal], type: 'normal' }
        ];

        let activeCharts = [];

        function parseChartDate(str) {
            if (!str) return null;
            const match = str.match(/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}))?/);
            if (!match) return null;
            const y = 2026;
            const m = parseInt(match[1]) - 1;
            const d = parseInt(match[2]);
            const hour = match[3] ? parseInt(match[3]) : 0;
            const min = match[4] ? parseInt(match[4]) : 0;
            return new Date(y, m, d, hour, min);
        }

        function parseLab(text) {
            const lab = {};
            const lines = text.split('\n').filter(l => l.trim());
            const regex = /(\d+(?:\.\d+)?)\s*.*?\s*\(?([\d\.\/-]+(?:\s+\d+:\d+)?)\)?/g;
            
            lines.forEach(l => {
                if (!l.includes(':') && !l.includes('：')) return;
                const parts = l.split(/[:：]/);
                const name = parts[0].trim();
                const key = name.toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (!lab[key]) lab[key] = { label: name, data: [] };
                let m; while ((m = regex.exec(parts[1])) !== null) {
                    const d = parseChartDate(m[2]);
                    if(d) lab[key].data.push({ x: d, y: parseFloat(m[1]) });
                }
            });

            Object.keys(lab).forEach(key => {
                const dataPoints = lab[key].data;
                const dailyGroups = {};
                dataPoints.forEach(pt => {
                    const d = new Date(pt.x);
                    d.setHours(0, 0, 0, 0);
                    const timeKey = d.getTime();
                    if (!dailyGroups[timeKey]) dailyGroups[timeKey] = [];
                    dailyGroups[timeKey].push(pt.y);
                });
                const aggregatedData = [];
                Object.keys(dailyGroups).forEach(timeKey => {
                    const vals = dailyGroups[timeKey];
                    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
                    let sd = 0;
                    if (vals.length > 1) {
                        const variance = vals.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (vals.length - 1);
                        sd = Math.sqrt(variance);
                    }
                    aggregatedData.push({ x: parseInt(timeKey), y: mean, sd: sd, count: vals.length });
                });
                aggregatedData.sort((a, b) => a.x - b.x);
                lab[key].data = aggregatedData;
            });
            return lab;
        }

        function parseMedDate(str) {
            if (!str) return null;
            const match = str.match(/(?:(\d{4})\/)?(\d{1,2})\/(\d{1,2})(?:\s+(上午|下午|AM|PM)?\s*(\d{1,2}):(\d{1,2}))?/i);
            if (!match) return null;
            
            const y = match[1] ? parseInt(match[1]) : 2026;
            const m = parseInt(match[2]) - 1;
            const d = parseInt(match[3]);
            const ampm = match[4];
            let hour = match[5] ? parseInt(match[5]) : 0;
            const min = match[6] ? parseInt(match[6]) : 0;
            
            if ((ampm === '下午' || (ampm && ampm.toUpperCase() === 'PM')) && hour < 12) hour += 12;
            if ((ampm === '上午' || (ampm && ampm.toUpperCase() === 'AM')) && hour === 12) hour = 0;
            
            return new Date(y, m, d, hour, min);
        }

        function parseMed(text) {
            const medsMap = {};
            const colors = Object.values(CHART_COLORS);
            const dateRegex = /(?:\d{4}\/)?\d{1,2}\/\d{1,2}(?:\s+(?:上午|下午|AM|PM)?\s*\d{1,2}:\d{1,2}(?::\d{1,2})?)?/gi;
            
            let globalMaxDate = new Date(0);
            const lines = text.split('\n').filter(l => l.trim() && !l.includes('處方') && !l.includes('開始時間'));
            
            lines.forEach(l => {
                const found = l.match(dateRegex);
                if (found) {
                    found.forEach(dStr => {
                        const d = parseMedDate(dStr);
                        if (d && d > globalMaxDate) globalMaxDate = d;
                    });
                }
            });
            if (globalMaxDate.getTime() === 0) globalMaxDate = new Date();

            let cIdx = 0;
            lines.forEach(l => {
                const datesFound = l.match(dateRegex);
                if (datesFound) {
                    const firstDateIdx = l.search(dateRegex);
                    const beforeDateStr = l.substring(0, firstDateIdx).trim();
                    
                    const cols = beforeDateStr.split(/\s{2,}/); 
                    let drugName = cols[0].trim();
                    let dosageDisplay = cols.slice(1).join(' ').trim();
                    
                    const isStat = beforeDateStr.toUpperCase().includes('STAT');
                    
                    const start = parseMedDate(datesFound[0]);
                    const end = isStat ? new Date(start.getTime() + 1000) : (datesFound.length > 1 ? parseMedDate(datesFound[1]) : new Date(Math.max(globalMaxDate.getTime(), start.getTime() + 86400000)));

                    if (start && end) {
                        if (!medsMap[drugName]) {
                            medsMap[drugName] = { segments: [], color: colors[cIdx++ % colors.length] };
                        }
                        medsMap[drugName].segments.push({ 
                            start: start.getTime(), 
                            end: end.getTime(), 
                            dosage: dosageDisplay,
                            isStat: isStat 
                        });
                    }
                }
            });
            return medsMap;
        }

        const drawErrorBarsPlugin = {
            id: 'errorBars',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx;
                chart.data.datasets.forEach((dataset, i) => {
                    const meta = chart.getDatasetMeta(i);
                    if (!meta.hidden && dataset.data && meta.yAxisID) {
                        meta.data.forEach((element, index) => {
                            const dataPoint = dataset.data[index];
                            if (dataPoint && dataPoint.sd && dataPoint.sd > 0) {
                                const yAxis = chart.scales[meta.yAxisID];
                                const x = element.x;
                                const yTop = yAxis.getPixelForValue(dataPoint.y + dataPoint.sd);
                                const yBottom = yAxis.getPixelForValue(dataPoint.y - dataPoint.sd);
                                ctx.save();
                                ctx.beginPath();
                                ctx.moveTo(x, yTop); ctx.lineTo(x, yBottom);
                                ctx.moveTo(x - 4, yTop); ctx.lineTo(x + 4, yTop);
                                ctx.moveTo(x - 4, yBottom); ctx.lineTo(x + 4, yBottom);
                                ctx.strokeStyle = dataset.borderColor;
                                ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
                            }
                        });
                    }
                });
            }
        };

        function createLabChart(title, keys, labData, groupConfig) {
            const wrapper = document.createElement('div');
            wrapper.className = 'chart-wrapper';
            const canvasId = `chart_${Math.random().toString(36).substr(2, 9)}`;
            wrapper.innerHTML = `<div class="chart-toolbar"><h3 class="chart-title">${title}</h3><button class="chart-btn" onclick="downloadChart('${canvasId}', '${title}.png')">📥 下載</button></div><canvas id="${canvasId}" style="max-height:300px;"></canvas>`;
            document.getElementById('chartsOutput').appendChild(wrapper);
            
            const datasets = keys.map((k, i) => ({
                label: labData[k].label,
                data: labData[k].data,
                borderColor: groupConfig.colors[i % groupConfig.colors.length],
                backgroundColor: groupConfig.colors[i % groupConfig.colors.length],
                yAxisID: (groupConfig.type === 'dual' && groupConfig.rightKeys?.some(rk => k.includes(rk))) ? 'y1' : 'y',
                tension: 0.3, pointRadius: 4
            }));

            activeCharts.push(new Chart(document.getElementById(canvasId).getContext('2d'), {
                type: 'line', data: { datasets }, plugins: [drawErrorBarsPlugin],
                options: {
                    scales: {
                        x: { type: 'time', time: { unit: 'day', displayFormats: { day: 'MM/dd' } } },
                        y: { position: 'left' },
                        ...(groupConfig.type === 'dual' ? { y1: { position: 'right', grid: { drawOnChartArea: false } } } : {})
                    }
                }
            }));
        }

        function createGanttChart(medsMap) {
            const labels = Object.keys(medsMap);
            const wrapper = document.createElement('div');
            wrapper.className = 'chart-wrapper';
            const canvasId = `chart_gantt_${Math.random().toString(36).substr(2, 9)}`;
            const chartHeight = (labels.length * 45) + 60;
            wrapper.innerHTML = `<div class="chart-toolbar"><h3 class="chart-title">用藥甘特圖 (● 圓點代表 STAT 處方)</h3><button class="chart-btn" onclick="downloadChart('${canvasId}', 'gantt.png')">📥 下載</button></div><div class="gantt-scroll-container"><canvas id="${canvasId}" style="height: ${chartHeight}px; width: 100%;"></canvas></div>`;
            document.getElementById('chartsOutput').appendChild(wrapper);

            const allData = []; const colors = [];
            let minD = Infinity, maxD = -Infinity;
            labels.forEach(name => {
                medsMap[name].segments.forEach(seg => {
                    allData.push({ x: [seg.start, seg.end], y: name, dosage: seg.dosage, isStat: seg.isStat });
                    colors.push(medsMap[name].color);
                    if(seg.start < minD) minD = seg.start; if(seg.end > maxD) maxD = seg.end;
                });
            });

            activeCharts.push(new Chart(document.getElementById(canvasId).getContext('2d'), {
                type: 'bar', data: { labels, datasets: [{ data: allData, backgroundColor: colors, borderRadius: 4, barPercentage: 0.8 }] },
                plugins: [{
                    id: 'drawCustomMarkers',
                    afterDatasetsDraw(chart) {
                        const ctx = chart.ctx;
                        chart.getDatasetMeta(0).data.forEach((bar, i) => {
                            const dataObj = chart.data.datasets[0].data[i];
                            const left = Math.min(bar.base, bar.x);
                            
                            if (dataObj.isStat) {
                                ctx.save();
                                ctx.fillStyle = 'white';
                                ctx.fillRect(left - 2, bar.y - bar.height/2, 5, bar.height);
                                ctx.beginPath();
                                ctx.arc(left, bar.y, 6, 0, Math.PI * 2);
                                ctx.fillStyle = chart.data.datasets[0].backgroundColor[i];
                                ctx.fill();
                                ctx.restore();
                            } else {
                                ctx.save();
                                ctx.fillStyle = 'white';
                                ctx.font = 'bold 12px Inter';
                                ctx.textAlign = 'left';
                                const width = Math.abs(bar.base - bar.x);
                                ctx.beginPath(); ctx.rect(left, bar.y - bar.height/2, width, bar.height); ctx.clip();
                                ctx.fillText(dataObj.dosage, left + 6, bar.y + 1);
                                ctx.restore();
                            }
                        });
                    }
                }],
                options: {
                    indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } },
                    scales: {
                        x: { type: 'time', min: minD - 86400000, max: maxD + 86400000, time: { unit: 'day', displayFormats: { day: 'MM/dd' } } },
                        y: { ticks: { font: { weight: 'bold' } } }
                    }
                }
            }));
        }

        function renderAll() {
            document.getElementById('chartsOutput').innerHTML = '';
            activeCharts.forEach(c => c.destroy()); activeCharts = [];
            const labText = document.getElementById('labDataInput').value;
            const medText = document.getElementById('medDataInput').value;
            if (labText) {
                const labData = parseLab(labText); const processed = new Set();
                LAB_GROUPS.forEach(g => {
                    const keys = Object.keys(labData).filter(k => g.keys.some(gk => k.includes(gk)) && labData[k].data.length > 0 && !processed.has(k));
                    if(keys.length > 0) { keys.forEach(k => processed.add(k)); createLabChart(g.name, keys, labData, g); }
                });
            }
            if (medText) createGanttChart(parseMed(medText));
        }

        window.downloadChart = (id, name) => { const c = document.getElementById(id); const a = document.createElement('a'); a.download = name; a.href = c.toDataURL(); a.click(); };
        window.clearAll = () => { if(confirm("清空？")) { document.getElementById('labDataInput').value = ""; document.getElementById('medDataInput').value = ""; renderAll(); } };
        let timer;
        const debounced = () => { clearTimeout(timer); timer = setTimeout(renderAll, 600); };
        document.getElementById('labDataInput').addEventListener('input', debounced);
        document.getElementById('medDataInput').addEventListener('input', debounced);
    </script>
</body>
</html>

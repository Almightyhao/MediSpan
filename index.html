<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫療數據智慧製圖工具 (v22.7.1 - 劑量解析優化版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body { font-family: "Inter", -apple-system, sans-serif; background-color: #f3f4f6; }
        .chart-wrapper { position: relative; margin-bottom: 2rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .gantt-scroll-container { width: 100%; overflow-y: auto; max-height: 700px; border: 1px solid #f3f4f6; background: white; }
        .chart-toolbar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 0.5rem; border-bottom: 1px solid #f3f4f6; padding-bottom: 0.5rem; }
        .chart-title { font-size: 1.1rem; font-weight: 700; color: #374151; margin-right: auto; }
        .chart-btn { font-size: 0.85rem; padding: 0.4rem 0.8rem; background: #3b82f6; color: white; border-radius: 4px; cursor: pointer; }
        textarea.nowrap { white-space: pre; overflow-x: auto; font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1600px] mx-auto w-full">
        <header class="mb-6">
            <h1 class="text-2xl font-extrabold text-gray-800">醫療數據智慧製圖工具 <span class="text-sm font-normal text-blue-600">v22.7.1</span></h1>
            <p class="text-gray-500 text-sm">已優化 HIS 欄位解析：精準擷取「劑量」欄位數值</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-green-500">
                    <label class="block text-lg font-bold text-gray-700 mb-2">請貼上 HIS 用藥紀錄</label>
                    <textarea id="medDataInput" rows="25" class="nowrap w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-green-500" placeholder="處方  劑量  頻率..."></textarea>
                </div>
            </div>

            <div class="space-y-6">
                <div id="chartsOutput">
                    <div id="emptyState" class="flex flex-col items-center justify-center text-gray-400 border-2 border-dashed border-gray-300 rounded-xl min-h-[500px]">
                        <p>等待數據輸入以生成圖表...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CHART_COLORS = { orange: '#f97316', blue: '#3b82f6', purple: '#a855f7', red: '#ef4444', teal: '#14b8a6', gray: '#6b7280', indigo: '#6366f1' };
        let activeCharts = [];

        function parseChartDate(str) {
            if (!str) return null;
            const match = str.match(/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}))?/);
            if (!match) return null;
            const y = 2026; // 根據當前系統時間
            const m = parseInt(match[1]) - 1;
            const d = parseInt(match[2]);
            const hour = match[3] ? parseInt(match[3]) : 0;
            const min = match[4] ? parseInt(match[4]) : 0;
            return new Date(y, m, d, hour, min);
        }

        function parseMed(text) {
            const medsMap = {};
            const colors = Object.values(CHART_COLORS);
            const lines = text.split('\n').filter(l => l.trim() && !l.includes('處方') && !l.includes('開始時間'));
            const dateRegex = /(\d{1,2}\/\d{1,2}(?:\s+\d{1,2}:\d{2})?)/g;

            let globalMaxDate = new Date(0);
            lines.forEach(l => {
                const found = l.match(dateRegex);
                if (found) found.forEach(dStr => {
                    const d = parseChartDate(dStr);
                    if (d && d > globalMaxDate) globalMaxDate = d;
                });
            });
            if (globalMaxDate.getTime() === 0) globalMaxDate = new Date();

            let cIdx = 0;
            lines.forEach(l => {
                const datesFound = l.match(dateRegex);
                if (datesFound && datesFound.length >= 1) {
                    const firstDateIdx = l.search(dateRegex);
                    const beforeDatePart = l.substring(0, firstDateIdx).trim();
                    
                    // 核心修正：利用多個空格切割欄位
                    // 預期格式: [藥名]  [劑量]  [頻率]  [用法]
                    const columns = beforeDatePart.split(/\s{2,}/);
                    
                    let drugName = "";
                    let dosageStr = "";
                    let freqStr = "";

                    if (columns.length >= 3) {
                        drugName = columns[0].trim();
                        dosageStr = columns[1].trim(); // 確保抓到「劑量」那一欄
                        freqStr = columns[2].trim();
                    } else {
                        // 備援方案：若無明顯空格，嘗試用正則分離
                        const fallback = beforeDatePart.match(/^(.*?)\s+([\d\.]+)\s+(\w+)/);
                        if(fallback) {
                            drugName = fallback[1];
                            dosageStr = fallback[2];
                            freqStr = fallback[3];
                        } else {
                            drugName = beforeDatePart;
                        }
                    }

                    const start = parseChartDate(datesFound[0]);
                    const end = datesFound.length > 1 ? parseChartDate(datesFound[1]) : new Date(Math.max(globalMaxDate.getTime(), start.getTime() + 86400000));
                    
                    const displayTag = `${dosageStr} ${freqStr}`.trim();

                    if (!medsMap[drugName]) {
                        medsMap[drugName] = { segments: [], color: colors[cIdx++ % colors.length] };
                    }
                    medsMap[drugName].segments.push({ start: start.getTime(), end: end.getTime(), dosage: displayTag });
                }
            });
            return medsMap;
        }

        function createGanttChart(medsMap) {
            const labels = Object.keys(medsMap);
            if (labels.length === 0) return;

            const container = document.getElementById('chartsOutput');
            container.innerHTML = '';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'chart-wrapper';
            const canvasId = `gantt_${Date.now()}`;
            const rowHeight = 40;
            const chartHeight = (labels.length * rowHeight) + 80;

            wrapper.innerHTML = `
                <div class="chart-toolbar">
                    <h3 class="chart-title">用藥時序甘特圖</h3>
                    <button class="chart-btn" onclick="downloadChart('${canvasId}')">📥 下載圖表</button>
                </div>
                <div class="gantt-scroll-container">
                    <canvas id="${canvasId}" style="height:${chartHeight}px; width:100%;"></canvas>
                </div>
            `;
            container.appendChild(wrapper);

            const allData = [];
            const barColors = [];
            let minDate = Infinity, maxDate = -Infinity;

            labels.forEach(name => {
                medsMap[name].segments.forEach(seg => {
                    allData.push({ x: [seg.start, seg.end], y: name, dosage: seg.dosage });
                    barColors.push(medsMap[name].color);
                    if (seg.start < minDate) minDate = seg.start;
                    if (seg.end > maxDate) maxDate = seg.end;
                });
            });

            const drawDosagePlugin = {
                id: 'drawDosage',
                afterDatasetsDraw(chart) {
                    const { ctx } = chart;
                    chart.data.datasets.forEach((dataset, i) => {
                        chart.getDatasetMeta(i).data.forEach((bar, index) => {
                            const val = dataset.data[index].dosage;
                            if (val) {
                                ctx.save();
                                ctx.font = 'bold 11px sans-serif';
                                ctx.fillStyle = 'white';
                                ctx.textAlign = 'left';
                                ctx.textBaseline = 'middle';
                                // 限制文字在長條內
                                const left = Math.min(bar.base, bar.x);
                                const width = Math.abs(bar.base - bar.x);
                                ctx.beginPath();
                                ctx.rect(left, bar.y - bar.height/2, width, bar.height);
                                ctx.clip();
                                ctx.fillText(val, left + 5, bar.y);
                                ctx.restore();
                            }
                        });
                    });
                }
            };

            activeCharts.push(new Chart(document.getElementById(canvasId), {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: allData, backgroundColor: barColors, borderRadius: 4, barPercentage: 0.8 }] },
                plugins: [drawDosagePlugin],
                options: {
                    indexAxis: 'y',
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            type: 'time', 
                            min: minDate - 43200000, 
                            max: maxDate + 43200000,
                            time: { unit: 'day', displayFormats: { day: 'MM/dd' } },
                            grid: { color: '#e5e7eb' }
                        },
                        y: { ticks: { font: { size: 11, weight: 'bold' } } }
                    }
                }
            }));
        }

        function render() {
            const medText = document.getElementById('medDataInput').value;
            if (!medText.trim()) return;
            const medsMap = parseMed(medText);
            createGanttChart(medsMap);
        }

        window.downloadChart = (id) => {
            const a = document.createElement('a');
            a.href = document.getElementById(id).toDataURL();
            a.download = 'medication_gantt.png';
            a.click();
        };

        let timer;
        document.getElementById('medDataInput').addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(render, 500);
        });
    </script>
</body>
</html>
